name: Build N0110
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dépendances
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi \
            python3 python3-pip imagemagick pkg-config \
            libpng-dev libjpeg-dev libfreetype-dev
          pip install --break-system-packages lz4 pypng pyelftools stringcase
      - name: Compilation
        run: make PLATFORM=n0110 epsilon.dfu -j4
      - uses: actions/upload-artifact@v4
        with:
          name: epsilon-n0110
          path: output/**/*.dfu
